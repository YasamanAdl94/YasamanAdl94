    <path d="M967 186 C940 215 934 253 899 281"/>
    <path d="M948 211 C963 222 966 236 964 250 M936 229 C918 229 907 239 901 255 M924 251 C937 261 939 273 934 286"/>
  </g>
  <g fill="#164b3b" stroke="#3b8f71" stroke-width="1">
