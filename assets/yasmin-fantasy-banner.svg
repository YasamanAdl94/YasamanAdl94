    <path d="M650 32 C727 60 747 20 830 52 S927 70 972 40"/>
    <path d="M632 48 C720 85 752 39 830 70 S920 86 975 60"/>
    <path d="M24 273 C108 239 164 294 242 256 S358 248 404 285"/>
    <path d="M30 290 C111 257 170 308 252 274 S352 267 396 299"/>
  </g>

