    <ellipse cx="89" cy="72" rx="6" ry="13" transform="rotate(51 89 72)"/>
    <ellipse cx="68" cy="52" rx="6" ry="12" transform="rotate(-30 68 52)"/>
    <ellipse cx="958" cy="237" rx="6" ry="13" transform="rotate(-34 958 237)"/>
    <ellipse cx="911" cy="248" rx="6" ry="13" transform="rotate(51 911 248)"/>
    <ellipse cx="932" cy="268" rx="6" ry="12" transform="rotate(-30 932 268)"/>
  </g>

  <!-- restrained map contours -->
