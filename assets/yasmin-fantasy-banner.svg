  <circle cx="153" cy="160" r="76" fill="#5b1d28" stroke="#c2a45e" stroke-width="3"/>
  <circle cx="153" cy="160" r="63" fill="none" stroke="#d1b36b" stroke-width="1" opacity="0.8"/>
  <path d="M119 173 C136 146 143 123 153 103 C164 126 172 149 188 173 C171 165 162 167 153 190 C144 167 136 165 119 173 Z" fill="none" stroke="#d1b36b" stroke-width="2"/>
  <circle cx="153" cy="159" r="6" fill="#d1b36b"/>

  <text x="268" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="59" font-weight="700" letter-spacing="7" fill="#ead9a5">YASMIN</text>
  <path d="M270 132 H727" stroke="#b99a55" stroke-width="1"/>
  <circle cx="744" cy="132" r="4" fill="#b99a55"/>
  <path d="M756 132 H898" stroke="#b99a55" stroke-width="1"/>
  <text x="270" y="163" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="1.1" fill="#c8d8ce">PhD researcher · audio-visual deepfake detection</text>
  <text x="270" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#d1b36b">seeking the signal beneath the illusion</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" letter-spacing="0.6">
    <rect x="270" y="232" width="92" height="31" rx="15.5" fill="#0d3f33" stroke="#2f8064"/>
    <text x="292" y="252" fill="#c7ded3">speech</text>
    <rect x="373" y="232" width="82" height="31" rx="15.5" fill="#0d3f33" stroke="#2f8064"/>
    <text x="395" y="252" fill="#c7ded3">video</text>
    <rect x="466" y="232" width="96" height="31" rx="15.5" fill="#0d3f33" stroke="#2f8064"/>
    <text x="486" y="252" fill="#c7ded3">emotion</text>
    <rect x="573" y="232" width="215" height="31" rx="15.5" fill="#321720" stroke="#71303d"/>
    <text x="594" y="252" fill="#dec5c8">identity-independent AI</text>
  </g>

  <!-- mountains and constellation -->
  <g fill="none" stroke="#527c72" stroke-width="1.5" opacity="0.7">
    <path d="M808 228 L851 170 L878 201 L909 149 L967 228"/>
    <path d="M830 201 L850 180 L861 193 M887 188 L908 158 L925 184"/>
