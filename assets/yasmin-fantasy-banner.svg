<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Yasmin — deepfake detection researcher</title>
  <desc id="desc">A high-fantasy manuscript-inspired research banner in midnight blue, emerald, oxblood, and antique gold.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061923"/>
      <stop offset="0.55" stop-color="#0a2730"/>
      <stop offset="1" stop-color="#07171f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d1b36b" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#d1b36b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="88" height="64" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="17" r="1" fill="#d8c083" opacity="0.44"/>
      <circle cx="61" cy="44" r="0.8" fill="#d8c083" opacity="0.30"/>
      <circle cx="82" cy="8" r="0.6" fill="#d8c083" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1000" height="320" rx="24" fill="url(#night)"/>
  <rect width="1000" height="320" rx="24" fill="url(#stars)"/>
  <ellipse cx="500" cy="155" rx="390" ry="190" fill="url(#glow)"/>
  <rect x="3" y="3" width="994" height="314" rx="21" fill="none" stroke="#b99a55" stroke-width="2"/>
  <rect x="12" y="12" width="976" height="296" rx="16" fill="none" stroke="#2c755d" stroke-width="1" opacity="0.9"/>

  <!-- original botanical corner ornaments -->
