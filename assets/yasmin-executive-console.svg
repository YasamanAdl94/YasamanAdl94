<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Yasmin: PhD researcher in deepfake detection</title>
  <desc id="desc">A cinematic executive technology banner with research configuration and an FFT magnitude spectrum.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="1" stop-color="#0a213a"/>
    </linearGradient>
    <pattern id="grid" width="80" height="40" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V40" fill="none" stroke="#102b43" stroke-width="1"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153d60" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0a2945" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="280" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="20" fill="url(#grid)" opacity="0.72"/>
  <path d="M520 0H660L470 280H330Z" fill="url(#beam)"/>
  <path d="M790 0H850L710 280H650Z" fill="#0c2c49" opacity="0.8"/>
  <rect x="2" y="2" width="996" height="276" rx="18" fill="none" stroke="#35688f" stroke-width="2"/>

  <rect x="45" y="42" width="6" height="183" fill="#2f80ed"/>
  <text x="80" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="58" font-weight="700" letter-spacing="4" fill="#e5f1ff">YASMIN</text>
  <text x="83" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#5ba7ff">PHD RESEARCHER  /  DEEPFAKE DETECTION</text>
  <text x="83" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8faecb">Building systems that detect manipulation,</text>
  <text x="83" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#e5f1ff">not identity.</text>
  <line x1="83" y1="219" x2="540" y2="219" stroke="#284c6d"/>
  <text x="83" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6f91af">AUDIO  ·  VIDEO  ·  EMOTION  ·  GENERALIZATION</text>

  <rect x="603" y="42" width="347" height="190" rx="14" fill="#081a2d" stroke="#315875" stroke-width="2"/>
  <circle cx="629" cy="64" r="4" fill="#3e6787"/>
  <circle cx="645" cy="64" r="4" fill="#3e6787"/>
  <circle cx="661" cy="64" r="4" fill="#3fc7a3"/>
  <text x="682" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#668ba8">research.config</text>
  <line x1="625" y1="82" x2="928" y2="82" stroke="#193750"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="628" y="108" fill="#5ba7ff">focus</text>
    <text x="719" y="108" fill="#5c7d98">=</text>
    <text x="739" y="108" fill="#e5f1ff">identity_independent</text>
    <text x="628" y="136" fill="#5ba7ff">modalities</text>
    <text x="719" y="136" fill="#5c7d98">=</text>
    <text x="739" y="136" fill="#e5f1ff">[audio, video]</text>
    <text x="628" y="164" fill="#5ba7ff">objective</text>
    <text x="719" y="164" fill="#5c7d98">=</text>
    <text x="739" y="164" fill="#e5f1ff">generalize()</text>
  </g>

  <text x="634" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#617f99">FFT MAG</text>
  <line x1="632" y1="216" x2="928" y2="216" stroke="#315875"/>
  <line x1="632" y1="186" x2="632" y2="216" stroke="#315875"/>
  <path d="M632 216 C650 216 661 215 669 211 C679 206 683 187 692 188 C701 190 706 209 718 212 C736 216 746 215 756 211 C769 205 775 197 788 198 C801 199 807 211 822 213 C839 215 844 213 852 207 C862 199 870 191 881 193 C893 195 897 210 906 212 C916 214 921 206 928 205" fill="none" stroke="#3fc7a3" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#617f99">
    <text x="635" y="228">0</text>
    <text x="770" y="228">4</text>
    <text x="908" y="228">8 kHz</text>
  </g>
</svg>
